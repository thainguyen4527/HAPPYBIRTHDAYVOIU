<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎂 Happy Birthday vợ iuu!</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital@1&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #fff0f5, #ffd6e7, #fff0f5);
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  /* floating petals */
  .petal {
    position: fixed;
    font-size: 16px;
    opacity: 0.5;
    animation: fall linear infinite;
    pointer-events: none;
  }
  @keyframes fall {
    from { transform: translateY(-30px) rotate(0deg); opacity: 0.6; }
    to   { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .card {
    text-align: center;
    position: relative;
    z-index: 10;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* CAKE SVG */
  .cake-wrap {
    position: relative;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%       { transform: translateY(-12px); }
  }

  .cake-svg { width: clamp(150px, 40vw, 220px); height: auto; }

  /* flame flicker */
  .flame { animation: flicker 0.6s ease-in-out infinite alternate; transform-origin: bottom center; }
  .flame2 { animation: flicker 0.5s ease-in-out infinite alternate-reverse; transform-origin: bottom center; animation-delay: 0.15s; }
  .flame3 { animation: flicker 0.7s ease-in-out infinite alternate; transform-origin: bottom center; animation-delay: 0.3s; }
  @keyframes flicker {
    from { transform: scaleY(1) scaleX(1); opacity: 1; }
    to   { transform: scaleY(1.15) scaleX(0.85); opacity: 0.85; }
  }

  /* sparkles around cake */
  .sparkle {
    position: absolute;
    font-size: 18px;
    animation: sparkleAnim 2s ease-in-out infinite;
    pointer-events: none;
  }
  .sparkle:nth-child(1) { top: -10px; left: 10px;  animation-delay: 0s; }
  .sparkle:nth-child(2) { top: -5px;  right: 5px;  animation-delay: 0.5s; }
  .sparkle:nth-child(3) { bottom: 20px; left: -15px; animation-delay: 1s; }
  .sparkle:nth-child(4) { bottom: 30px; right: -12px; animation-delay: 0.3s; }
  @keyframes sparkleAnim {
    0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; }
    50%       { transform: scale(1.3) rotate(20deg); opacity: 1; }
  }

  .name-text {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(28px, 8vw, 46px);
    color: #f06292;
    margin-top: 16px;
    text-shadow: 0 2px 12px rgba(240,98,146,0.25);
    animation: fadeIn 1s ease both;
    animation-delay: 0.5s;
  }
  .hint-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(14px, 3.5vw, 18px);
    color: #c47fa0;
    margin-top: 8px;
    animation: fadeIn 1s ease both;
    animation-delay: 1s;
    letter-spacing: 0.5px;
  }

  /* pulse ring on tap */
  .ring {
    position: absolute; inset: -20px;
    border-radius: 50%;
    border: 2px solid rgba(240,98,146,0.4);
    animation: ringPulse 2.5s ease-out infinite;
    pointer-events: none;
  }
  .ring2 { animation-delay: 0.8s; }
  @keyframes ringPulse {
    0%   { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.3);  opacity: 0; }
  }

  /* click burst */
  .burst { display: none; position: fixed; inset: 0; pointer-events: none; z-index: 100; }
  .burst.show { display: block; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* tap hint wiggle */
  .card:active .cake-wrap { animation: none; transform: scale(0.93); }
</style>
</head>
<body>

<!-- floating petals -->
<script>
const petalEmojis = ['🌸','🌷','💗','🌺'];
for (let i = 0; i < 12; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalEmojis[i % petalEmojis.length];
  p.style.left = (Math.random() * 100) + '%';
  p.style.animationDuration = (Math.random() * 8 + 7) + 's';
  p.style.animationDelay = (Math.random() * 8) + 's';
  p.style.fontSize = (Math.random() * 10 + 12) + 'px';
  document.body.appendChild(p);
}
</script>

  <div class="name-text">Thương yêu 💗</div>

<script>
function openBirthday() {
  // heart burst effect
  const emojis = ['💗','🌸','💕','✨','🌷','💖'];
  for (let i = 0; i < 16; i++) {
    setTimeout(() => {
      const h = document.createElement('div');
      h.style.cssText = `
        position:fixed; pointer-events:none; z-index:999;
        font-size:${Math.random()*18+16}px;
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        animation: burstFly 1s ease-out forwards;
      `;
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1000);
    }, i * 60);
  }

  // navigate after short delay
  setTimeout(() => {
    // Change this URL to your GitHub Pages link!
    window.location.href = 'https://thainguyen4527.github.io/HAPPYBIRTHDAYVOIUUUUU/';
  }, 900);
}

// add burst animation
const style = document.createElement('style');
style.textContent = `
  @keyframes burstFly {
    0%   { transform: scale(0.5) translate(0,0); opacity: 1; }
    100% { transform: scale(1.5) translate(${Math.random()>0.5?'':'-'}${Math.random()*60+20}px, -${Math.random()*80+40}px); opacity: 0; }
  }
`;
document.head.appendChild(style);
</script>
